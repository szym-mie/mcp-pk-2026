apiVersion: v1
kind: Namespace
metadata:
  name: mcp-lab

---
apiVersion: v1
kind: Namespace
metadata:
  name: suu-lab

# -------------------------------------------------------------------
# RBAC for mcp-lab
# ServiceAccount used by the MCP pod:
#   system:serviceaccount:mcp-lab:default
#
# -------------------------------------------------------------------

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: default-mcp-broad-namespace-modify
  namespace: mcp-lab
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - events
    verbs:
      - get
      - list
      - watch

      # Uncomment for modification experiments:
      # - create
      # - update
      # - patch
      # - delete

  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get

      # Uncomment for destructive pod restart demos:
      # - delete

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
      - watch

      # Uncomment for modification experiments:
      # - create
      # - update
      # - patch
      # - delete

  - apiGroups: ["apps"]
    resources:
      - deployments/scale
      - statefulsets/scale
    verbs:
      - get

      # Uncomment for scaling experiments:
      # - update
      # - patch

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch

      # Uncomment for job creation/deletion experiments:
      # - create
      # - update
      # - patch
      # - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: default-mcp-broad-namespace-modify
  namespace: mcp-lab
subjects:
  - kind: ServiceAccount
    name: default
    namespace: mcp-lab
roleRef:
  kind: Role
  name: default-mcp-broad-namespace-modify
  apiGroup: rbac.authorization.k8s.io

