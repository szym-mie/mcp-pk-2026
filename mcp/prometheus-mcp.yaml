apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-namespace-read
  namespace: agent
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-namespace-read-binding
  namespace: agent
subjects:
  - kind: ServiceAccount
    name: default
    namespace: agent
roleRef:
  kind: Role
  name: mcp-namespace-read
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-monitoring-access
  namespace: monitor
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
    verbs:
      - get
      - list
      - watch
      - patch
      - update

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-monitoring-binding
  namespace: monitor
subjects:
  - kind: ServiceAccount
    name: default
    namespace: agent
roleRef:
  kind: Role
  name: mcp-monitoring-access
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-monitoring-crd-access
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
    verbs:
      - get
      - list
      - watch
      - patch
      - update

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-monitoring-crd-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: agent
roleRef:
  kind: ClusterRole
  name: mcp-monitoring-crd-access
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-mcp
  namespace: agent

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-access
  namespace: agent
spec:
  podSelector:
    matchLabels:
      app: prometheus-mcp
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor
      ports:
        - protocol: TCP
          port: 9090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-mcp
  namespace: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-mcp
  template:
    metadata:
      labels:
        app: prometheus-mcp
    spec:
      serviceAccountName: prometheus-mcp
      containers:
        - name: prometheus-mcp
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus-operated.monitor.svc.cluster.local:9090"
          ports:
            - containerPort: 8000
          command:
            - /bin/sh
            - -c
          args:
            - |
              pip install --no-cache-dir mcp[cli] mcpo httpx pydantic
              mcpo --host 0.0.0.0 --port 8000 -- python /app/server.py
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          volumeMounts:
            - name: prometheus-mcp-server-code
              mountPath: /app/server.py
              subPath: server.py
      volumes:
        - name: prometheus-mcp-server-code
          configMap:
            name: prometheus-mcp-code

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-mcp
  namespace: agent
spec:
  selector:
    app: prometheus-mcp
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
