apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-mcp
  namespace: agent

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-access
  namespace: agent
spec:
  podSelector:
    matchLabels:
      app: prometheus-mcp
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor
      ports:
        - protocol: TCP
          port: 9090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-mcp
  namespace: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-mcp
  template:
    metadata:
      labels:
        app: prometheus-mcp
    spec:
      serviceAccountName: prometheus-mcp
      containers:
        - name: mcp
          image: ghcr.io/szym-mie/prometheus-mcp:latest
          imagePullPolicy: Always
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus-operated.monitor.svc.cluster.local:9090"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-mcp
  namespace: agent
spec:
  selector:
    app: prometheus-mcp
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
