apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: mcp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            # Connect Open WebUI to Ollama service in the same namespace.
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"

            # Lab-only. Do not expose publicly with auth disabled.
            - name: WEBUI_AUTH
              value: "false"

            # Needed for direct OpenAPI / MCPO tool-server integrations.
            - name: ENABLE_DIRECT_CONNECTIONS
              value: "True"

            # Allows users to configure direct tool servers.
            - name: USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS
              value: "True"

          resources:
            requests:
              cpu: "750m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
      volumes:
        - name: open-webui-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: mcp-demo
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: 8080